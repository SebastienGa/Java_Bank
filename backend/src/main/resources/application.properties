spring.application.name=java-bank
server.port=8080

# Le schéma est piloté par Flyway : Hibernate ne doit jamais le modifier.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

# Aucune configuration de datasource ici (pas d'identifiants en clair).
# La connexion à la base (URL, utilisateur, mot de passe) est fournie par
# le profil "local" (application-local.properties, non versionné) ou par
# des variables d'environnement en production.
# Activation du profil local : --spring.profiles.active=local
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
