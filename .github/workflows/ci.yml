name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build, tests et couverture
        id: verify
        run: mvn -B verify

      # Si les tests échouent, verify s'arrête avant le rapport JaCoCo :
      # on le génère quand même à partir de target/jacoco.exec.
      - name: Rapport JaCoCo après échec
        if: failure() && steps.verify.outcome == 'failure'
        continue-on-error: true
        run: mvn -B jacoco:report

      - name: Résumé des tests
        if: always()
        run: >
          python3 ../.github/scripts/test_summary.py
          --surefire-dir target/surefire-reports
          --jacoco-xml target/site/jacoco/jacoco.xml
          --output target/test-summary.json

      - name: Publication des résultats
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          retention-days: 30
          if-no-files-found: warn
          path: |
            backend/target/surefire-reports/*.xml
            backend/target/site/jacoco/
            backend/target/test-summary.json

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx tsc -b
      - run: npx eslint .
      - run: npm run build
